name: Update Infrastructure

on:
  workflow_run:
    workflows:
      - Build and Push
    types:
      - completed

jobs:
  update-infra:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Feroz723/ai-task-platform-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update image tags
        working-directory: infra
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          REGISTRY="ghcr.io/${{ github.event.workflow_run.repository.full_name }}"

          for SERVICE in web api worker; do
            FILE="k8s/base/${SERVICE}/deployment.yaml"
            if [ -f "$FILE" ]; then
              sed -i "s|image: .*|image: ${REGISTRY}/${SERVICE}:sha-${SHA}|" "$FILE"
            fi
          done

      - name: Commit and push
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tags to sha-${{ github.event.workflow_run.head_sha }}"
            git push
          fi
